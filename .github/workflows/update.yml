name: Update Dashboard Daily

on:
  schedule:
    # Three syncs a day, staggered so one missed slot does not leave the dashboard stale all day.
    # UTC times; Pacific is 6:00, 12:00 and 18:00 during standard time (PST, UTC-8).
    # In daylight time (PDT, from March) they run an hour later locally.
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
  # Pushing a change to this file runs a sync. Used because manual dispatch needs repo admin rights (forced sync 2026-11-26).
  push:
    paths:
      - '.github/workflows/update.yml'

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install garminconnect

      - name: Sync with remote first
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Dashboard Bot"
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch Garmin data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
        run: python scripts/fetch_garmin.py

      - name: Compute readiness scores
        run: python scripts/readiness_engine.py

      - name: Fetch Strava activity intelligence
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_strava_intelligence.py

      - name: Generate AI training analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/analyze_training.py

      - name: Commit and push updated data
        run: |
          git add data/
          git diff --staged --quiet || git commit -m "Auto-update $(date '+%Y-%m-%d')"
          git push
